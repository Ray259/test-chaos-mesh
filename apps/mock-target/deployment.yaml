apiVersion: apps/v1

kind: Deployment
metadata:
  name: mock-target
  namespace: mock-app
  labels:
    app: mock-target
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mock-target
  template:
    metadata:
      labels:
        app: mock-target
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
            - containerPort: 8080 # for status
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
        - name: exporter
          image: nginx/nginx-prometheus-exporter:1.1.0
          args: ["-nginx.scrape-uri=http://localhost:8080/stub_status"]
          ports:
            - containerPort: 9113
      volumes:
        - name: nginx-conf
          configMap:
            name: mock-target-config


---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-target-config
  namespace: mock-app
data:
  default.conf: |
    server {
        listen 80;
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
    server {
        listen 8080;
        location /stub_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
