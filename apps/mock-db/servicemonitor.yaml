apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mock-db
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: mock-db
  namespaceSelector:
    matchNames:
      - mock-app
  endpoints:
    - port: metrics
      interval: 15s
