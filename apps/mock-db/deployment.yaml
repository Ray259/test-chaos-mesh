apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-db-init-sql
  namespace: mock-app
data:
  init.sql: |
    CREATE TABLE users (
        id SERIAL PRIMARY KEY,
        username VARCHAR(50) NOT NULL,
        email VARCHAR(100) NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    INSERT INTO users (username, email) VALUES
    ('admin', 'admin@local'),
    ('ops_agent', 'ops@local');
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-db
  namespace: mock-app
  labels:
    app: mock-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-db
  template:
    metadata:
      labels:
        app: mock-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: sandbox
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres123
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          ports:
            - containerPort: 9187
          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://postgres:postgres123@localhost:5432/sandbox?sslmode=disable"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: pgdata
          emptyDir: {}

        - name: init-sql
          configMap:
            name: mock-db-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: mock-db
  namespace: mock-app
  labels:
    app: mock-db
spec:
  selector:
    app: mock-db
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
    - name: metrics
      protocol: TCP
      port: 9187
      targetPort: 9187

